schema_version: '1.1'
name: aa-ma-plan-planning-standard
tags:
- aa-ma-plan
plugins:
- ../../../claude-code
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Using the AA-MA planning standard, what must a plan for adding a --shout flag to greet.py contain?
    Tools here are read-only: do not try to change files. List the required elements; do not write the
    plan.'
