name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on all .sh files
        run: find . -name '*.sh' -exec shellcheck {} +

  bandit:
    name: Bandit (Python Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit on src/
        run: bandit -r src/ -f json || true

  ruff:
    name: Ruff (Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Run ruff check
        run: uv run ruff check src/

  bats:
    name: Bats (Hook + Command Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bats-core/bats-action@4.0.0

      # ubuntu-latest currently ships shellcheck, but C4 in
      # tests/commands/sole-dev-merge/test_stage_c_dispatch.bats now skips
      # rather than fails when it is missing — so an image change would turn
      # a security assertion green-by-skipping instead of red. Install it
      # explicitly so the skip path can never be reached silently in CI.
      - name: Install shellcheck (required by Stage C / C4)
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run bats on tests/hooks/
        run: bats --recursive tests/hooks/

      - name: Run bats on tests/commands/sole-dev-merge/
        # M5.6: adds the M1-M5 sole-dev-merge bats suite to CI so the 60+
        # stage-level + smoke-E2E tests block PRs that regress the workflow.
        run: bats tests/commands/sole-dev-merge/

  codemem-smoke:
    name: codemem smoke test
    runs-on: ubuntu-latest
    # Runs unconditionally on main + PRs; the steps themselves are fast
    # (~5s end-to-end) so no path-filtering is needed. If the smoke ever
    # exceeds a minute, gate this job behind a `paths` filter targeting
    # packages/codemem-mcp/** and tests/codemem/**.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # git-mining tools need real history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Sync workspace deps
        run: uv sync

      - name: ast-grep version drift check
        # Warn (not fail) if installed ast-grep-cli is outside the declared
        # >=0.42,<0.43 range. New point releases MAY land wheels with
        # behaviour drift worth auditing against our rule fixtures.
        run: |
          INSTALLED=$(uv run python -c "from importlib.metadata import version; print(version('ast-grep-cli'))")
          echo "installed ast-grep-cli: $INSTALLED"
          case "$INSTALLED" in
            0.42.*) echo "within declared range >=0.42,<0.43 — OK" ;;
            *)      echo "::warning::ast-grep-cli $INSTALLED is outside declared range >=0.42,<0.43 — consider updating the pin" ;;
          esac

      - name: codemem build smoke (this repo as fixture)
        run: uv run codemem build

      - name: codemem query smoke (1 representative call)
        run: uv run codemem query who_calls refresh_commits_cache

      - name: codemem unit tests (fast tier)
        run: uv run pytest tests/codemem/ -q -x --tb=short

      - name: aa_ma core unit tests (top-level)
        # Covers tests/test_*.py at the top level under tests/.
        # Currently exercises tests/test_goal_synthesis.py
        # (Skill(goal-condition-synthesis) reference-impl regression net).
        run: uv run pytest tests/test_goal_synthesis.py -q --tb=short
