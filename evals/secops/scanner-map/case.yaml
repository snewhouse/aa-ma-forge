schema_version: '1.1'
name: secops-scanner-map
tags:
- secops
plugins:
- ../../../claude-code
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Which security checks should this repo run, and at which layer (edit, commit, CI)? Tools here
    are read-only: do not try to change files.'
