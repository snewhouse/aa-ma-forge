name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC: new Ruff S rules or advisories surface without a push

# Least privilege: no job writes to the repo or calls a write API. Explicit so a
# change to the repo's default token setting cannot widen it. Actions are pinned
# by commit SHA (tag in the trailing comment); a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run ShellCheck on all .sh files
        run: find . -name '*.sh' -exec shellcheck {} +

  ruff-security:
    # code-conventions-impact M8 (DECISION ruff-only, docs/research/code-conventions-impact-ruff-vs-bandit.md).
    # Replaces the Bandit job, whose `|| true` meant it could never fail. Full scan of the
    # gated paths on every run; per-site `# noqa: S… # why:` is the only way past a finding.
    name: Ruff S (Python security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.3'

      - name: Sync locked deps
        run: uv sync --locked

      - name: Ruff S over src, packages, scripts
        run: uv run ruff check --isolated --select S src packages scripts

  deps:
    # code-conventions-impact M8.4. uv audit is experimental in uv 0.12.3 (A6), so pip-audit
    # checks a hashed export of the lock. Ignores: .pip-audit-ignore, each with an expiry
    # date (tests/security/test_deps_audit.py fails an expired one).
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.3'
          python-version: '3.13'

      - name: Sync locked deps
        run: uv sync --locked

      - name: Ignores are current (an expired waiver fails here, in the job it waives)
        run: uv run pytest -q tests/security/test_deps_audit.py::test_every_ignore_has_an_id_a_why_and_an_unexpired_date

      - name: Export the lock with hashes
        run: uv export --frozen --no-emit-workspace --no-emit-project -o req.txt

      - name: pip-audit (hashes required, strict)
        run: |
          ignores=()
          while read -r id _; do ignores+=(--ignore-vuln "$id"); done < <(grep -Ev '^[[:space:]]*(#|$)' .pip-audit-ignore)
          uv run pip-audit --disable-pip --require-hashes --strict -r req.txt "${ignores[@]}"

  gitleaks:
    # code-conventions-impact M8.3. Full-history secret scan; ignores are reviewed
    # fingerprints in .gitleaksignore only (no path or regex allowlist).
    name: gitleaks (secrets, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # --log-opts=--all needs every commit
          persist-credentials: false

      - name: Install gitleaks v8.18.4 (sha256-verified release tarball)
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks_8.18.4_linux_x64.tar.gz" | sha256sum -c
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz gitleaks
          ./gitleaks version

      - name: Scan every commit
        run: ./gitleaks detect --redact --exit-code 1 --log-opts="--all"

  touched:
    # code-conventions-impact M1 / ADR-0018. Replaces the src/-only `ruff` job: the
    # .pre-commit-config.yaml hooks run over the files this PR touches, and every
    # touched file must comply in full (D8). Untouched files are not linted here;
    # full-repo Ruff S returns in M8.
    name: Touched files (pre-commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # --from-ref needs the base branch's history
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.3'

      - name: Install shellcheck (the shellcheck hook is language system)
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: Verify shellcheck is usable
        run: shellcheck --version

      - name: Sync locked deps
        run: uv sync --locked

      - name: pre-commit over the PR diff
        env:
          BASE_REF: ${{ github.base_ref }}   # via env, never interpolated into the script
          SKIP: gitleaks-system              # why: a staged-only scan; the gitleaks job scans full history
        run: uv run pre-commit run --from-ref "origin/${BASE_REF}" --to-ref HEAD --show-diff-on-failure

  bats:
    name: Bats (Hook + Command Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0

      # ubuntu-latest currently ships shellcheck, but the shellcheck case in
      # tests/hooks/security-static-check.bats skips rather than fails when it
      # is missing — so an image change would turn a security assertion
      # green-by-skipping instead of red.
      #
      # Conditional: the common path costs nothing, and an apt outage still
      # reds the job rather than silently proceeding to a skip.
      - name: Install shellcheck (required by the security-static-check hook tests)
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)

      # Assert the guarantee the step above only claims. `bats` reports a
      # skipped test as `ok N # skip` and exits 0, so without this a stray
      # PATH change would let that case evaporate while the job
      # stayed green — the same green-by-skipping failure, one level up.
      - name: Verify shellcheck is usable
        run: shellcheck --version

      # aa-ma-gate-python.bats (milestone-grammar-ssot M5) drives the shipped §6.7/§7.1
      # fences, which call `uv run --project <root> aa-ma-gate`. Without uv the
      # launcher returns 127 and 17 cases fail — the job had been red since 2026-09-11.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.3'
          python-version: '3.13'

      - name: Sync locked deps (aa-ma-gate is a project script)
        run: uv sync --locked

      # The shipped fences and their tests call bare `ruff`, `aa-ma-gate`, `cz` the way a
      # developer shell resolves them; expose the synced venv the same way.
      - name: Put the project venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify project tools are runnable
        run: aa-ma-gate --help >/dev/null && ruff --version && cz version

      - name: Run bats on tests/hooks/
        run: bats --recursive tests/hooks/

      - name: Run bats on tests/commands/sdm/
        # sole-dev-merge-simplify M1: sdm.sh, the one-script /sole-dev-merge (ADR-0024).
        run: bats tests/commands/sdm/

      - name: Run bats on tests/commands/*.bats
        # aa-ma-share-allow.bats (M3) and release.bats (scripts/release.sh) — top-level
        # command/script suites were not covered by the steps above.
        run: bats tests/commands/*.bats

  codemem-smoke:
    name: codemem smoke test
    runs-on: ubuntu-latest
    # Runs unconditionally on main + PRs; the steps themselves are fast
    # (~5s end-to-end) so no path-filtering is needed. If the smoke ever
    # exceeds a minute, gate this job behind a `paths` filter targeting
    # packages/codemem-mcp/** and tests/codemem/**.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0    # git-mining tools need real history
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.3'
          python-version: '3.13'

      - name: Sync locked workspace deps
        run: uv sync --locked

      - name: Import contracts (import-linter)
        # Includes aa-ma-never-imports-codemem (ADR-0014): without this step
        # every contract in .importlinter is local-only and a violation merges green.
        run: uv run lint-imports

      - name: ast-grep version drift check
        # Warn (not fail) if installed ast-grep-cli is outside the declared
        # >=0.42,<0.43 range. New point releases MAY land wheels with
        # behaviour drift worth auditing against our rule fixtures.
        run: |
          INSTALLED=$(uv run python -c "from importlib.metadata import version; print(version('ast-grep-cli'))")
          echo "installed ast-grep-cli: $INSTALLED"
          case "$INSTALLED" in
            0.42.*) echo "within declared range >=0.42,<0.43 — OK" ;;
            *)      echo "::warning::ast-grep-cli $INSTALLED is outside declared range >=0.42,<0.43 — consider updating the pin" ;;
          esac

      - name: codemem build smoke (this repo as fixture)
        run: uv run codemem build

      - name: codemem query smoke (1 representative call)
        run: uv run codemem query who_calls refresh_commits_cache

      - name: codemem unit tests (fast tier)
        run: uv run pytest tests/codemem/ -q -x --tb=short

      - name: aa_ma core unit tests (top-level)
        # Covers tests/test_*.py at the top level under tests/.
        # Currently exercises tests/test_goal_synthesis.py
        # (Skill(goal-condition-synthesis) reference-impl regression net).
        run: uv run pytest tests/test_goal_synthesis.py -q --tb=short

      - name: pytest — everything not run by a dedicated step (mattpocock-trio-adoption M1 §6.8)
        # Exclusion, not enumeration: a hand-listed set silently skipped
        # tests/test_grammar*.py, tests/test_active_plans_canonical.py and
        # tests/tui for months. codemem and goal_synthesis have their own steps
        # above; perf/slow are opted out via addopts; *.bats live under tests/
        # but pytest never collects them.
        run: uv run pytest tests -q --tb=short --ignore=tests/codemem --ignore=tests/perf --ignore=tests/test_goal_synthesis.py

  architecture-drift:
    # diagram-generation M6 / ADR-0016. Its own job, not a step in codemem-smoke,
    # so a red X names what broke: docs/architecture/ drifted from the code.
    name: Architecture drift (docs/architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.3'
          python-version: '3.13'

      - name: Sync locked workspace deps
        run: uv sync --locked

      - name: Build the codemem index
        run: uv run codemem build

      - name: codemem draw --check
        # Fix: uv run codemem build && uv run codemem draw --write,
        # then commit docs/architecture/.
        run: uv run codemem draw --check

  explorer-contract:
    # diagram-generation M12 / map Ticket 11. Its own job, so a red X names what broke:
    # the explorer's JS drifted from codemem's node ids or collapse rule
    # (tests/fixtures/draw-node-ids.json), or its CSP no longer admits its own script.
    name: Explorer contract (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.3'
          python-version: '3.13'

      - name: Sync locked workspace deps
        run: uv sync --locked

      - name: Build the codemem index and the explorer page
        run: uv run codemem build && uv run aa-ma-render --explorer --out build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false    # no package.json; nothing to cache

      - name: node --test (node ids, collapse rule, CSP hashes)
        env:
          EXPLORER_HTML: build/explorer.html
        run: node --test tests/render/explorer_contract.test.mjs
