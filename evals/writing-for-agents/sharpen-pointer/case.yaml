schema_version: '1.1'
name: writing-for-agents-sharpen-pointer
tags:
- writing-for-agents
plugins:
- ../../../claude-code
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'CLAUDE.md here says ''See docs/deploy.md for more info.'' Improve that line so the agent reads
    docs/deploy.md when it should. Tools here are read-only: do not try to change files.'
