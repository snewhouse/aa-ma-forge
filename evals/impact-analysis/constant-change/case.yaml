schema_version: '1.1'
name: impact-analysis-constant-change
tags:
- impact-analysis
plugins:
- ../../../claude-code
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'I want to change MAX_ROWS in lib.py from 100 to 50. Run an impact analysis before the edit.
    Tools here are read-only: do not try to change files.'
