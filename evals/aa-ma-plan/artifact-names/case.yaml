schema_version: '1.1'
name: aa-ma-plan-artifact-names
tags:
- aa-ma-plan
plugins:
- ../../../claude-code
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'I want an AA-MA plan for adding a --shout flag to greet.py, task name shout-flag. Tools here
    are read-only: do not try to change files. Before planning, list the files the plan will produce and
    where they go.'
