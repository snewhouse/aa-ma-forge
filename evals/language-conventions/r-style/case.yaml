schema_version: '1.1'
name: language-conventions-r-style
tags:
- language-conventions
plugins:
- ../../../claude-code
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Which formatter and linter should analysis/clean.R use, and what in the file breaks the R style conventions?
    Tools here are read-only: do not try to change files.'
