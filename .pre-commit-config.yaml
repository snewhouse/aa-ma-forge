# Touched-files lint harness (code-conventions-impact M1, ADR-0018).
# Locally pre-commit checks staged files; CI's `touched` job runs it over the PR diff
# with --from-ref/--to-ref. Untouched files are never linted against new rules (D8).
# Every lint hook is `repo: local` so it runs the uv-locked tool, never a hook repo's own pin
# (gitleaks, below, takes only its hook definition from a frozen rev).
# Eval fixtures (tests/fixtures/evals/) plant defects on purpose for skill evals (ADR-0021).
exclude: ^tests/fixtures/evals/
repos:
  # Hook definition only, from a SHA-frozen rev (v8.18.4); gitleaks-system runs the installed
  # binary on staged changes. CI's gitleaks job is the full-history gate.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 02808f45d038526bfcceebcbf6421c1047997ff9  # frozen: v8.18.4
    hooks:
      - id: gitleaks-system
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        args: ["--"]   # why: a staged file named like an option is a path, never a flag
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
        args: ["--"]   # why: a staged file named like an option is a path, never a flag
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        # Opt-in check: SC2310 set -e off in conditions (T8). SC2312 dropped after M6: mostly `echo "$(cmd)"` noise.
        args: ["--enable=check-set-e-suppressed"]
        language: system
        types: [shell]
        exclude_types: [bats]   # bats is not plain shell; 19 of 31 .bats fail shellcheck (ADR-0018)
      - id: check-conventions
        name: check_conventions (added lines only)
        entry: uv run python scripts/check_conventions.py
        # `--` before the filenames: a committed file named `--from-ref=X` must stay a
        # file, not switch the diff to an empty range (§6.8 security).
        args: ["--"]
        language: system
        require_serial: true   # one process: each run re-reads the whole diff
