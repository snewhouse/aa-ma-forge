schema_version: '1.1'
name: aa-ma-plan-first-phase
tags:
- aa-ma-plan
plugins:
- ../../../claude-code
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Plan a feature for this repo with the AA-MA planning workflow: add a --shout flag to greet.py
    that upper-cases the greeting. Tools here are read-only: do not try to change files. Nobody can answer
    questions in this session, so stop after the first phase and list the questions you would ask me.'
