# I/O sink catalogue for the io view (diagram-generation M9; research:
# docs/research/diagram-generation-io-sink-catalogue.md, Ticket 6).
#
# Rows are written from each library's official docs (`source`). Semgrep rules are
# NOT a source: the Semgrep Rules License v1.0 forbids redistribution.
#
# tier: qualified — `symbol` is the whole callee as codemem stores it (python heads
#                   are rewritten through the import-alias map; JS/TS/Go use the
#                   conventional local name, e.g. `fs`, `http`, `os`).
#       bare      — `symbol` is a method name; it matches the LAST segment of a
#                   callee that has a receiver whose type codemem does not know
#                   (`conn.execute`). Low confidence: drawn dashed.
# lang and symbol may each be a list. Python's builtin `open` is deliberately
# absent: it stays in python_ast._CALL_EXCLUDE (M9 AC5).
# Non-call boundaries (`os.environ[...]`, `process.env.X`) are out of v1.

