schema_version: '1.1'
name: language-conventions-sql-review
tags:
- language-conventions
plugins:
- ../../../claude-code
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Review queries/report.sql against good SQL conventions. What should change, and which tool should enforce it?
    Tools here are read-only: do not try to change files.'
