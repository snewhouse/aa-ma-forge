schema_version: '1.1'
name: writing-for-agents-review-draft-skill
tags:
- writing-for-agents
plugins:
- ../../../claude-code
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Review draft/SKILL.md, a skill I am writing, and tell me what to fix. Tools here are read-only:
    do not try to change files.'
